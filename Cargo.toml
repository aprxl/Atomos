[package]
name = "atomos"
rust-version = "1.98"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
glyphon = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }
lyon = "1.0.19"
lyon_extra = "1.1"
log = "0.4"
pollster = "0.4"
swash = "0.2.9"
taffy = { version = "=0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
unicode-segmentation = "1"
wgpu = "29.0.4"
winit = "0.30.13"
